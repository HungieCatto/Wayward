<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wayward</title>
<meta name="description" content="Random driving routes from your location: loops or one way, with or without highways.">
<meta name="theme-color" content="#10282f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wayward">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Layout: full-bleed map, floating top bar (app name + locate button), bottom sheet for controls/result. */
:root{
  --bg:#eef2f3; --surface:#ffffff; --surface-2:#f3f6f7; --fg:#10282f; --muted:#5b7076;
  --line:#d9e2e4; --sign:#1456b8; --sign-fg:#ffffff; --signal:#ff5c48; --ok:#1d8a5b; --warn:#c77700;
  --route:#1456b8; --route-case:#ffffff; --shadow:0 10px 30px rgba(16,40,47,.18);
  --display:"Archivo","Arial Narrow",system-ui,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0b1b20; --surface:#122a31; --surface-2:#18353d; --fg:#e8f0f1; --muted:#93a9ae;
    --line:#24444c; --sign:#3d82f0; --signal:#ff6f5c; --ok:#3ccf8e; --warn:#f0a83a;
    --route:#5aa0ff; --route-case:#0b1b20; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark; }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#map{position:fixed;inset:0;z-index:0;background:var(--bg)}
.leaflet-control-attribution{font-size:10px;display:none}
.attr-open .leaflet-control-attribution{display:block}
.attrbtn{width:24px;height:24px;border-radius:50%;border:0;background:var(--surface);color:var(--muted);font:700 13px/24px Georgia,serif;
  box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:pointer;padding:0;opacity:.85}
.attrbtn:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.tiles-dark{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9) saturate(.6)}
.leaflet-bottom.leaflet-right{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 6px);right:max(6px,env(safe-area-inset-right,0px))}
/* On narrow screens the panel spans the full width: sit just above its collapsed bar instead */
@media (max-width:560px){.leaflet-bottom.leaflet-right{bottom:calc(var(--peek,90px) + 6px)}}

/* Top bar */
.top{position:fixed;z-index:20;left:0;right:0;top:0;display:flex;gap:10px;align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));pointer-events:none}
.top>*{pointer-events:auto}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:6px 14px 6px 6px;box-shadow:var(--shadow);height:44px}
.brand img{width:32px;height:32px;border-radius:8px}
.brand b{font:800 17px/1 var(--display);letter-spacing:.01em}
.locbtn{width:44px;height:44px;flex:none;border-radius:14px;background:var(--surface);border:0;box-shadow:var(--shadow);
  color:var(--fg);display:grid;place-items:center;cursor:pointer}

/* Bottom sheet */
.sheet{position:fixed;z-index:20;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;background:var(--surface);
  border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));
  max-height:78vh;overflow:auto}
.grab{display:block;width:100%;height:28px;margin:-10px 0 4px;padding:0;border:0;background:transparent;cursor:grab;touch-action:none}
.grab span{display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:9px auto}
.grab:hover span{background:var(--muted)}
.grab:focus-visible{outline:2px solid var(--signal);outline-offset:-2px;border-radius:8px}
.sheet.collapsed{transform:translateY(calc(100% - var(--peek,90px)));overflow:hidden}
.sheet.dragging{transition:none!important;overflow:hidden}
.grab:active{cursor:grabbing}
h2{font:800 20px/1.15 var(--display);margin:0 0 12px;letter-spacing:.01em;text-wrap:balance}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

.field{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:14px;padding:10px 14px}
.field label{flex:1}
.dist{display:flex;align-items:baseline;gap:4px}
.dist input{width:84px;border:0;background:transparent;color:var(--fg);font:800 28px/1 var(--display);text-align:right;
  font-variant-numeric:tabular-nums;outline:none;padding:0}
.dist span{font:700 15px var(--display);color:var(--muted)}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0 12px}
.chip{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:6px 0;white-space:nowrap;font:600 13px var(--body);cursor:pointer}
.chip:active{background:var(--surface-2)}

.toggles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.tog{background:var(--surface-2);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;position:relative}
.tog .t{font:700 15px var(--display)}
.tog .d{font-size:12px;color:var(--muted);line-height:1.3;min-height:2.6em}
.tog input{position:absolute;opacity:0;pointer-events:none}
.tog.wide{grid-column:1 / -1;flex-direction:row;align-items:center;justify-content:space-between;gap:12px}
.tog.wide .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.tog.wide .d{min-height:0}
.tog.wide .sw{flex:none}
.startpin.finish{background:var(--ok)}
.startpin.stop{background:var(--sign);border-radius:50%}

.legend{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--muted);margin:-4px 2px 12px}
.legend i{flex:1;height:6px;border-radius:3px;background:linear-gradient(90deg,rgb(47,124,246),rgb(167,89,230),rgb(255,122,61))}


/* Road weather chip + popup */
.wx{position:fixed;z-index:22;right:max(14px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 64px);
  display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:calc(100% - 28px)}
.wxrow{display:flex;gap:8px;justify-content:flex-end;align-items:flex-start;max-width:100%}
.wxrow .wxchip{min-width:0}
.wxdetail{max-width:320px}
.wxchip{display:flex;align-items:center;gap:8px;border:0;border-radius:12px;padding:8px 12px;font:600 13px/1.25 var(--body);
  box-shadow:var(--shadow);cursor:pointer;text-align:left;background:var(--surface);color:var(--fg)}
.wxchip svg{flex:none}
.wxchip b{display:block;font:700 14px/1.2 var(--display)}
.wxchip small{display:block;font-weight:500;opacity:.85}
.wxchip.ok{color:var(--ok)}
.wxchip.ok b{color:var(--fg)}
.wxchip.warn{background:#f5a524;color:#2b1a00}
.wxchip.bad{background:#d93a3a;color:#fff}
.wxchip.glare{background:#ffd23f;color:#2b2200}
.wxchip.night{background:#1d2a5c;color:#e6ebff}
.wxchip:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.wxpop{background:var(--surface);color:var(--fg);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);font-size:13px;line-height:1.4;
  border-left:4px solid #f5a524}
.wxpop p{margin:0 0 10px}
.wxpop .acts{display:flex;gap:8px}
.wxpop .acts .btn{padding:9px 10px;font-size:13px;border-radius:10px}
.wxdetail{background:var(--surface);color:var(--fg);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow);font-size:12.5px;line-height:1.45}
.wxdetail ul{margin:4px 0 0;padding-left:18px}
.picking .wx{display:none}
.icepin{width:18px;height:18px;border-radius:50%;background:#7cc4ff;border:3px solid #fff;box-shadow:0 0 0 6px rgba(124,196,255,.35)}

.bymode{margin:-6px 0 14px;display:flex;flex-direction:column;gap:6px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;color:var(--muted);font:700 13px var(--body);padding:8px 6px;border-radius:9px;cursor:pointer}
.seg button[aria-checked="true"]{background:var(--sign);color:#fff}
.seg button:focus-visible{outline:2px solid var(--signal);outline-offset:1px}
.zonelabel{background:var(--surface);color:var(--fg);border-radius:8px;padding:3px 7px;font:700 11px var(--body);white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.3);transform:translate(-50%,-50%);display:inline-block}

/* Stops */
.stops{margin-bottom:14px;display:flex;flex-direction:column;gap:8px}
.stoplist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.stoplist:empty{display:none}
.stoplist li{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:12px;padding:8px 6px 8px 10px}
.stoplist .n{width:22px;height:22px;flex:none;border-radius:50%;background:var(--sign);color:#fff;display:grid;place-items:center;font:800 11px var(--display)}
.stoplist .nm{flex:1;min-width:0;font-weight:600;font-size:14px;line-height:1.25}
.stoplist .nm small{display:block;color:var(--muted);font-weight:500;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stoplist button{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:4px 8px;border-radius:8px}
.addstop{display:flex;align-items:center;gap:8px;border:1.5px dashed var(--line);background:transparent;color:var(--fg);border-radius:12px;padding:10px 12px;font:600 14px var(--body);cursor:pointer;text-align:left}
.addstop:focus-visible,.stoplist button:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.addpanel{display:flex;flex-direction:column;gap:6px}
.searchrow{display:flex;gap:8px}
.searchrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:12px;padding:10px 12px;font:500 16px var(--body)}
.searchrow input:focus{outline:2px solid var(--sign);outline-offset:0}
.results{list-style:none;margin:0;padding:0;border-radius:12px;overflow:hidden;background:var(--surface-2)}
.results:empty{display:none}
.results li{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px;font-weight:600}
.results li:last-child{border-bottom:0}
.results li small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.results li.note{cursor:default;color:var(--muted);font-weight:500}
.picking .sheet{transform:translateY(calc(100% - 120px));transition:transform .25s}
.sheet{transition:transform .25s}
.pickbar{position:fixed;z-index:25;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 66px);background:var(--sign);color:#fff;
  padding:10px 14px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;width:max-content;max-width:calc(100% - 32px)}
.pickbar button{background:rgba(255,255,255,.2);border:0;color:#fff;font:700 13px var(--body);padding:6px 10px;border-radius:8px;cursor:pointer}
.sw{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.tog input:checked + .sw{background:var(--sign)}
.tog input:checked + .sw::after{transform:translateX(18px)}
.tog input:focus-visible + .sw{outline:2px solid var(--sign);outline-offset:2px}

.btn{width:100%;border:0;border-radius:16px;padding:15px 18px;font:800 17px var(--display);letter-spacing:.02em;cursor:pointer;
  background:var(--sign);color:var(--sign-fg);display:flex;align-items:center;justify-content:center;gap:10px}
.btn:disabled{opacity:.6;cursor:progress}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.sm{padding:11px 12px;font-size:14px;border-radius:12px}
.btn:focus-visible,.chip:focus-visible,.locbtn:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}

.msg{font-size:13px;color:var(--muted);margin:10px 2px 0;min-height:1.2em}
.msg.err{color:var(--signal)}

/* Result */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--surface-2);border-radius:14px;padding:10px 12px}
.stat{min-width:0}
.stat b{display:block;font:800 19px/1.15 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface-2)}
.pill.hw{color:var(--warn)} .pill.nohw{color:var(--ok)} .pill.by{color:var(--sign)}
.stack{display:flex;flex-direction:column;gap:8px}
details{background:var(--surface-2);border-radius:14px;padding:10px 14px}
summary{cursor:pointer;font-weight:600}
ol.turns{list-style:none;margin:8px 0 0;padding:0 8px 0 0;font-size:13px;max-height:30vh;overflow:auto}
ol.turns li{display:grid;grid-template-columns:2.2em 1fr auto;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line)}
ol.turns li:last-child{border-bottom:0}
ol.turns .no{color:var(--muted);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
ol.turns .km{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tip{font-size:12px;color:var(--muted);margin:2px 2px 0}
.linkish{background:none;border:0;color:var(--muted);font:600 13px var(--body);text-decoration:underline;cursor:pointer;padding:6px;margin:4px auto 0;display:block}

.me{width:18px;height:18px;border-radius:50%;background:var(--sign);border:3px solid #fff;box-shadow:0 0 0 6px rgba(20,86,184,.25)}
.startpin{width:22px;height:22px;border-radius:6px;background:var(--signal);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);
  display:grid;place-items:center;color:#fff;font:800 11px var(--display)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="map" aria-label="Map"></div>

<div class="top">
  <div class="brand"><img src="icon-192.png" alt=""><b>Wayward</b></div>
  <button class="locbtn" id="locBtn" aria-label="Centre on my location">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
  </button>
</div>

<div class="wx" id="wx" aria-live="polite">
  <div class="wxrow">
    <button class="wxchip" id="litChip" hidden aria-expanded="false"></button>
    <button class="wxchip" id="wxChip" hidden aria-expanded="false"></button>
  </div>
  <div class="wxdetail" id="wxDetail" hidden></div>
  <div class="wxdetail" id="litDetail" hidden></div>
  <div class="wxpop" id="wxPop" hidden role="dialog" aria-label="Ice on the route">
    <p id="wxPopText"></p>
    <div class="acts"><button class="btn sm" id="wxNew">Generate new route</button><button class="btn ghost sm" id="wxKeep">Keep this one</button></div>
  </div>
</div>
<div class="pickbar" id="pickBar" hidden><span>Tap the map where the route should go</span><button id="pickCancel">Cancel</button></div>

<section class="sheet" id="sheet" aria-live="polite">
  <button class="grab" id="grab" aria-label="Hide panel" aria-expanded="true"><span></span></button>

  <!-- Setup view -->
  <div id="setup">
    <h2>Where to today?</h2>
    <div class="field">
      <label for="dist" class="label">Total distance</label>
      <div class="dist"><input id="dist" type="number" inputmode="decimal" min="2" max="300" step="1" value="25"><span>km</span></div>
    </div>
    <div class="chips" id="chips">
      <button class="chip" data-km="10">10 km</button><button class="chip" data-km="25">25 km</button>
      <button class="chip" data-km="50">50 km</button><button class="chip" data-km="75">75 km</button><button class="chip" data-km="100">100 km</button>
    </div>
    <div class="toggles">
      <label class="tog wide" for="loop">
        <span class="txt"><span class="t">Round trip</span>
        <span class="d" id="loopDesc">Loops back to where you started</span></span>
        <input type="checkbox" id="loop" role="switch" checked><span class="sw"></span>
      </label>
      <label class="tog" for="hw">
        <span class="t">Highways</span>
        <span class="d" id="hwDesc">Autobahn &amp; Schnellstraße allowed</span>
        <input type="checkbox" id="hw" role="switch"><span class="sw"></span>
      </label>
      <label class="tog" for="by">
        <span class="t">Bystreets</span>
        <span class="d" id="byDesc">Normal mix of roads</span>
        <input type="checkbox" id="by" role="switch"><span class="sw"></span>
      </label>
    </div>
    <div class="bymode" id="byModeRow" hidden>
      <div class="seg" role="radiogroup" aria-label="How bystreets are planned">
        <button role="radio" data-v="exact" id="byExact">Exact streets</button>
        <button role="radio" data-v="areas" id="byAreas">Areas to explore</button>
      </div>
      <p class="tip" id="byModeTip"></p>
    </div>
    <div class="stops">
      <ol class="stoplist" id="stopList"></ol>
      <button class="addstop" id="addStopBtn" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Add a stop the route must pass
      </button>
      <div class="addpanel" id="addPanel" hidden>
        <div class="searchrow">
          <input id="placeQ" type="search" placeholder="Search a place or address" autocomplete="off" aria-label="Search a place">
          <button class="btn ghost sm" id="pickBtn" style="width:auto">Pick on map</button>
        </div>
        <ul class="results" id="placeResults"></ul>
      </div>
    </div>
    <button class="btn" id="goBtn">Generate random route</button>
    <p class="msg" id="msg">Finding your location…</p>
  </div>

  <!-- Result view -->
  <div id="result" hidden>
    <h2 id="resTitle">Your route</h2>
    <div class="stats">
      <div class="stat"><span class="label">Distance</span><b id="rKm">–</b></div>
      <div class="stat"><span class="label">Time</span><b id="rTime">–</b></div>
      <div class="stat"><span class="label">Turns</span><b id="rTurns">–</b></div>
    </div>
    <div class="pills" id="rPills"></div>
    <div class="legend" aria-label="Line colour shows the order: blue at the start, orange at the end"><span>Start</span><i></i><span>End</span></div>
    <div class="stack">
      <button class="btn" id="navBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 4.5 20.3l.7.7L12 18l6.8 3 .7-.7z"/></svg>
        Start navigation
      </button>
      <p class="tip" id="navTip"></p>
      <button class="btn ghost" id="homeBtn" hidden>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 11 12 3l9 8v10h-6v-6H9v6H3z"/></svg>
        Navigate home
      </button>
      <div class="row2">
        <button class="btn ghost sm" id="againBtn">New route</button>
        <button class="btn ghost sm" id="gpxBtn">Save GPX</button>
      </div>
      <button class="btn ghost" id="backBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
        Change settings
      </button>
    </div>
  </div>

</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(() => {
'use strict';
const VALHALLA = 'https://valhalla1.openstreetmap.de/route';
const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString('de-AT', {maximumFractionDigits: 1});

/* ---------- Storage ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },

/* ---------- Explore areas: put them where residential streets really are ----------
   For each planned area, try the spot and 4 nearby alternatives (~800 m away). Each is scored by a 3×3

    const opts = [w, ...[0, 1, 2, 3].map(k => dest(w, k * 90 + Math.random() * 60, .6 + Math.random() * .4))];
    opts.forEach(c => {
      const dLat = .00225, dLon = .00225 / Math.cos(rad(c.lat));

    });

  if (!locs.length) return wps;
  let res;
  try { res = await vpost('locate', {costing: 'auto', locations: locs}); } catch { return wps; }

    let n = 0;
    for (let k = 0; k < 9; k++) {
      const e = res[c.from + k] && res[c.from + k].edges && res[c.from + k].edges[0];
      if (e && hav([locs[c.from + k].lat, locs[c.from + k].lon], [e.correlated_lat, e.correlated_lon]) < .12) n++;

    if (w.user) return w;

    const best = mine.reduce((a, b) => b.s > a.s ? b : a);
    return best.s >= 5 ? {...w, lat: best.c.lat, lon: best.c.lon, zone: true} : w;

}

    setChip('warn', share('snow') ? 'snow' : 'fog', share('snow') ? 'Snow on part of the route' : 'Fog on part of the route', tr, details);
  } else {
    setChip('ok', 'ok', 'Roads look clear', tr, details);
  }
}
// Circle as a ring of [lon, lat] for the router's exclude_polygons.
function circleRing(c, km) {
  const ring = [];
  for (let a = 0; a <= 360; a += 30) { const p = dest(c, a, km); ring.push([p.lon, p.lat]); }
  return ring;
}

/* ---------- Result ---------- */
let lineLayer = null;
function clearRoute() {
  routeLayers.forEach(l => map.removeLayer(l)); routeLayers = [];
  if (lineLayer) { map.removeLayer(lineLayer); lineLayer = null; }
}
// Colour along the route: blue at the start → violet → orange at the end.
const GRAD = [[47, 124, 246], [167, 89, 230], [255, 122, 61]];
function gradColor(t) {
  const s = t < .5 ? 0 : 1, u = t < .5 ? t * 2 : (t - .5) * 2, a = GRAD[s], b = GRAD[s + 1];
  return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * u)).join(',')})`;
}
// Draws the route for the current zoom: each direction sits slightly to its right-hand side
// (like driving in your lane), coloured by progress, with arrows every ~70 px.
function drawLine() {
  if (!route) return;
  if (lineLayer) map.removeLayer(lineLayer);
  const OFF = 3.5, pts = [];
  for (const ll of route.shape) {
    const p = map.latLngToLayerPoint(ll);
    if (!pts.length || p.distanceTo(pts[pts.length - 1]) > .5) pts.push(p);
  }
  const n = pts.length;
  if (n < 2) return;
  const segN = [];
  for (let i = 0; i < n - 1; i++) {
    const dx = pts[i + 1].x - pts[i].x, dy = pts[i + 1].y - pts[i].y, L2 = Math.hypot(dx, dy) || 1;
    segN.push([-dy / L2, dx / L2]); // right-hand normal on screen (y points down)
  }
  const off = pts.map((p, i) => {
    const a = segN[Math.max(0, i - 1)], b = segN[Math.min(n - 2, i)];
    let nx = a[0] + b[0], ny = a[1] + b[1]; const l = Math.hypot(nx, ny);
    if (l < .3) { nx = b[0]; ny = b[1]; } else { nx /= l; ny /= l; }
    const k = Math.min(OFF / Math.max(l / 2, .5), OFF * 2); // keep corners from spiking
    return L.point(p.x + nx * k, p.y + ny * k);
  });
  const lls = off.map(p => map.layerPointToLatLng(p));
  const cum = [0];
  for (let i = 1; i < n; i++) cum.push(cum[i - 1] + off[i].distanceTo(off[i - 1]));
  const total = cum[n - 1] || 1, g = L.layerGroup();
  L.polyline(lls, {color: css('--route-case'), weight: 9, opacity: .85, interactive: false}).addTo(g);
  // Colour chunks
  const CH = 40; let i0 = 0;
  for (let c = 1; c <= CH; c++) {
    let i1 = i0; const lim = total * c / CH;
    while (i1 < n - 1 && cum[i1] < lim) i1++;
    if (i1 > i0) L.polyline(lls.slice(i0, i1 + 1), {color: gradColor((c - .5) / CH), weight: 5, opacity: 1, interactive: false, lineCap: 'butt'}).addTo(g);
    i0 = i1;
  }
  // Arrows every 70 px along the whole route, but only placed where they're on screen
  // (plus a margin), so zooming in never runs out of arrows. Redrawn on pan and zoom.
  const tl = map.containerPointToLayerPoint([0, 0]), br = map.containerPointToLayerPoint(map.getSize());
  const sz = map.getSize(), view = L.bounds(tl.subtract(sz), br.add(sz)); // one screen of margin on every side
  const step = 70; let next = 35, j = 0, count = 0;
  while (next < total && count < 400) {
    while (j < n - 2 && cum[j + 1] < next) j++;
    const seg = cum[j + 1] - cum[j] || 1, t = (next - cum[j]) / seg;
    const x = off[j].x + (off[j + 1].x - off[j].x) * t, y = off[j].y + (off[j + 1].y - off[j].y) * t;
    if (!view.contains(L.point(x, y))) { next += step; continue; }
    const ang = Math.atan2(off[j + 1].y - off[j].y, off[j + 1].x - off[j].x) * 180 / Math.PI;
    L.marker(map.layerPointToLatLng(L.point(x, y)), {interactive: false, keyboard: false, icon: L.divIcon({className: 'rarrow', iconSize: [12, 12],
      html: `<svg width="12" height="12" viewBox="0 0 12 12" style="display:block;transform:rotate(${ang}deg)"><path d="M3 2 9 6 3 10" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`})}).addTo(g);
    next += step; count++;
  }
  lineLayer = g.addTo(map);
}
map.on('moveend', drawLine); // fires after every pan and zoom
// Also refresh while panning, at most ~3 times a second (not during zoom animations).
let lastDraw = 0, zooming = false;
map.on('zoomstart', () => { zooming = true; });
map.on('zoomend', () => { zooming = false; });
map.on('move', () => {
  const t = performance.now();
  if (zooming || t - lastDraw < 300) return;
  lastDraw = t; drawLine();
});
function showRoute(rt, hw, by, D) {
  route = rt; route.hw = hw; route.by = by;
  checkRouteWeather(rt);
  // Areas mode: put each zone on the route (nearest point) so it's where you'll actually pass.
  rt.zonePts = (rt.zones || []).map(z => { let b = rt.shape[0], bd = 1e9; rt.shape.forEach(q => { const d = hav(q, [z.lat, z.lon]); if (d < bd) { bd = d; b = q; } }); return {lat: b[0], lon: b[1]}; });
  clearRoute();
  const tot = rt.shape.length;
  drawLine();
  rt.zonePts.forEach((z, i) => {
    const c = rt.zones[i];
    routeLayers.push(L.circle([c.lat, c.lon], {radius: 450, color: css('--ok'), weight: 2, dashArray: '6 6', fillColor: css('--ok'), fillOpacity: .12, interactive: false}).addTo(map));
    routeLayers.push(L.marker([c.lat, c.lon], {interactive: false, zIndexOffset: 600, icon: L.divIcon({className: '', iconSize: [0, 0], html: `<span class="zonelabel">Explore ${i + 1}</span>`})}).addTo(map));
  });
  routeLayers.push(L.marker(rt.shape[0], {zIndexOffset: 800, icon: L.divIcon({className: '', html: '<div class="startpin">S</div>', iconSize: [22, 22]})}).addTo(map));
  if (rt.oneway) routeLayers.push(L.marker(rt.shape[tot - 1], {icon: L.divIcon({className: '', html: '<div class="startpin finish">Z</div>', iconSize: [22, 22]})}).addTo(map));

  const turns = rt.man.filter(m => ![1, 2, 3, 4, 5, 6, 8, 22, 23].includes(m.type)).length;
  $('rKm').textContent = fmt(rt.km) + ' km';
  const mins = Math.round(rt.sec / 60);
  $('rTime').textContent = mins >= 60 ? `${Math.floor(mins / 60)}:${String(mins % 60).padStart(2, '0')} h` : `${mins} min`;
  $('rTurns').textContent = turns;
  const pills = [];
  pills.push(rt.highway ? '<span class="pill hw">Includes highway · Vignette needed</span>' : '<span class="pill nohw">No highways</span>');
  if (by) pills.push(!rt.areas ? '<span class="pill by">Bystreet focus</span>'
    : rt.zonePts.length ? `<span class="pill by">Explore the side streets in the ${rt.zonePts.length} circled area${rt.zonePts.length > 1 ? 's' : ''}</span>`
    : '<span class="pill">No built-up areas found nearby · try New route</span>');
  if (rt.toll) pills.push('<span class="pill hw">Toll section</span>');
  if (rt.uturns) pills.push(`<span class="pill hw">${rt.uturns} U-turn${rt.uturns > 1 ? 's' : ''} on this route</span>`);
  if (Math.abs(rt.km - D) / D > .15) pills.push(`<span class="pill">Closest to ${fmt(D)} km we found</span>`);
  if (rt.oneway) pills.unshift('<span class="pill by">One way</span>');
  $('rPills').innerHTML = pills.join('');
  const kind = rt.oneway ? 'drive out' : 'loop';
  $('resTitle').textContent = by ? (rt.areas ? `Side-street areas ${kind}` : `Tight-streets ${kind}`) : rt.highway ? `Mixed ${kind} with highway` : `Country & town ${kind}`;
  $('navTip').textContent = hw ? 'Opens Google Maps with the route as stops.'
    : 'Opens Google Maps with the route as stops. Tip: in Google Maps, turn on Route options → Avoid highways, so it doesn\'t shortcut between stops.';
  $('homeBtn').hidden = !rt.oneway;
  show('result');
  requestAnimationFrame(() => map.fitBounds(L.latLngBounds(rt.shape), {paddingTopLeft: [20, 80], paddingBottomRight: [20, $('sheet').offsetHeight + 20]}));
}
function esc(s) { return String(s || '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c])); }

function samplePoints(shape, n) {
  const cum = [0];
  for (let i = 1; i < shape.length; i++) cum.push(cum[i - 1] + hav(shape[i - 1], shape[i]));
  const tot = cum[cum.length - 1], out = []; let j = 0;
  for (let i = 1; i <= n; i++) {
    const t = tot * i / (n + 1);
    while (j < cum.length - 1 && cum[j] < t) j++;
    out.push(shape[j]);
  }
  return out;
}
// n points along a path: your stops plus evenly spaced samples, in the order the path reaches them.
function alongPath(shape, n, extra = []) {
  const near = p => { let bi = 0, bd = 1e9; shape.forEach((q, i) => { const d = hav(q, [p.lat, p.lon]); if (d < bd) { bd = d; bi = i; } }); return bi; };
  const must = [...stops.map(s => ({lat: s.lat, lon: s.lon, user: true})), ...extra.slice(0, Math.max(0, n - stops.length))];
  return [...samplePoints(shape, Math.max(0, n - must.length)).map(([lat, lon]) => ({lat, lon})), ...must]
    .map(p => ({...p, idx: near(p)})).sort((a, b) => a.idx - b.idx);
}
// Way back: from wherever you are now to the start, Google Maps picks the route.
$('navBtn').onclick = () => {
  if (!route) return;
  const s = route.shape[0], e = route.shape[route.shape.length - 1];
  // Google Maps links take up to 9 stops; your own stops are always among them.
  const wp = alongPath(route.shape, route.oneway ? 7 : 8, route.zonePts || []).map(p => p.lat.toFixed(6) + ',' + p.lon.toFixed(6)).join('|');
  const url = `https://www.google.com/maps/dir/?api=1&origin=${s[0]},${s[1]}&destination=${e[0]},${e[1]}&waypoints=${encodeURIComponent(wp)}&travelmode=driving&dir_action=navigate`;
  window.open(url, '_blank');
};
$('homeBtn').onclick = () => {
  if (!route) return;
  const s = route.shape[0];
  window.open(`https://www.google.com/maps/dir/?api=1&destination=${s[0]},${s[1]}&travelmode=driving&dir_action=navigate`, '_blank');
};
$('gpxBtn').onclick = async () => {
  if (!route) return;
  const date = new Date().toISOString();
  const pts = route.shape.map(p => `<trkpt lat="${p[0]}" lon="${p[1]}"/>`).join('');
  const gpx = `<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="Wayward" xmlns="http://www.topografix.com/GPX/1/1"><metadata><time>${date}</time></metadata><trk><name>Wayward ${fmt(route.km)} km</name><trkseg>${pts}</trkseg></trk></gpx>`;
  const name = `wayward-${date.slice(0, 10)}-${Math.round(route.km)}km.gpx`;
  const file = new File([gpx], name, {type: 'application/gpx+xml'});
  try {
    if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: name}); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
};
$('againBtn').onclick = generate;
$('backBtn').onclick = () => {
  route = null; clearRoute(); show('setup'); setMsg('Ready. Set your distance and go.'); if (me) map.setView([me.lat, me.lon], 14);
  avoidAreas = []; clearIcePins(); $('wxPop').hidden = true; areaWxAt = 0; checkAreaWeather();
};
$('goBtn').onclick = generate;
startGeo();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
